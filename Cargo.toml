[package]
name = "rust-erp"
version = "0.1.0"
edition = "2024"

[dependencies]
erp = { path = "erp" }
tracing.workspace = true
tracing-subscriber.workspace = true

[workspace]
members = [
    "code_gen",
    "erp",
    "erp/erp_assets_build",
    "erp/erp_cache",
    "erp/erp_internal_types",
    "erp/erp_types",
    "erp_search",
    "erp_server",
    "erp_search_code_gen",
    "plugins/*",
]
exclude = ["plugins/bin"]

[workspace.dependencies]

axum = "0.8"
tokio = "1"
reqwest = { version = "0.12", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.38", features = ["db-postgres"] }
argon2 = { version = "0.5", features = ["std"] }
# Signing CSRF tokens. Already built for the PostgreSQL driver.
hmac = "0.13"
sha2 = "0.11"
config = { version = "0.15", default-features = false, features = ["toml"] }
directories = "6.0"
libloading = "0.9"
proc-macro2 = "1.0"
postgres = { version = "0.19.10", features = ["with-chrono-0_4"] }
quote = "1.0"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# TypeScript for plugins' browser files, compiled at build time only.
swc_core = { version = "81", default-features = false }
serde_derive = "1.0"
serial_test = "3.2.0"
syn = "2.0"
thiserror = "2.0"
uuid = { version = "1.16.0", features = ["v4"] }

# Dependencies built optimised even in debug: hashing a password with argon2 unoptimised takes
# seconds, which every login of the tests and of a development server pays.
[profile.dev.package."*"]
opt-level = 2
