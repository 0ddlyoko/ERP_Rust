[package]
name = "erp_server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "erp_server"
path = "src/main.rs"

[lib]
name = "erp_server"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

erp = { path = "../erp" }
base = { path = "../plugins/base" }
# Built with the server, so the plugin libraries it loads share its build of erp.
web = { path = "../plugins/web" }
mail = { path = "../plugins/mail" }
contacts = { path = "../plugins/contacts" }
uom = { path = "../plugins/uom" }
currency = { path = "../plugins/currency" }
sequence = { path = "../plugins/sequence" }
product = { path = "../plugins/product" }
account = { path = "../plugins/account" }
l10n_be = { path = "../plugins/l10n_be" }
sale = { path = "../plugins/sale" }
purchase = { path = "../plugins/purchase" }
stock = { path = "../plugins/stock" }
sale_stock = { path = "../plugins/sale_stock" }
purchase_stock = { path = "../plugins/purchase_stock" }
stock_account = { path = "../plugins/stock_account" }
project = { path = "../plugins/project" }
timesheet = { path = "../plugins/timesheet" }
sale_project = { path = "../plugins/sale_project" }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
test_utilities = { path = "../erp/test_utilities" }
test_plugin = { path = "../plugins/test_plugin" }
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "test-util", "time"] }
