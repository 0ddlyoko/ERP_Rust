[package]
name = "test_plugin"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing.workspace = true
erp = { path = "../../erp" }
code_gen = { path = "../../code_gen" }
# Overriding a method means naming the tag of the plugin that declared it, so the crate that
# declared it has to be a real dependency. That is what makes a mismatched signature a compile error.
test_utilities = { path = "../../erp/test_utilities" }

[build-dependencies]
erp_assets_build = { path = "../../erp/erp_assets_build" }

[lib]
crate-type = ["dylib"]
